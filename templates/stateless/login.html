{% extends "stateless/base.html" %}
{% block title %}登录 · Blog Admin{% endblock %}
{% block body %}
<main class="login card stack">
    <div>
        <h1>登录博客编辑器</h1>
        <div class="muted">账号由部署平台环境变量管理，不会写入数据库。</div>
    </div>
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    <form class="stack" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label>用户名<input name="username" autocomplete="username" required autofocus></label>
        <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
    </form>
    <a class="muted" href="{% url 'setup' %}">查看环境变量配置说明</a>
</main>
{% endblock %}
