{% extends "stateless/base.html" %}
{% block title %}关系图谱 · Blog Admin{% endblock %}
{% block head %}
<style>
    .graph-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .graph-heading-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .graph-toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) auto auto; gap: 12px; align-items: end; }
    .graph-search { min-width: 0; }
    .graph-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 42px; }
    .graph-filters label { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; cursor: pointer; }
    .graph-filters input { width: 17px; height: 17px; margin: 0; accent-color: var(--primary); }
    .graph-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .graph-actions select { min-height: 42px; }
    .graph-card { position: relative; min-width: 0; height: clamp(480px, 70dvh, 760px); padding: 0; overflow: hidden; background: color-mix(in srgb, var(--card) 92%, var(--bg)); }
    .graph-canvas { display: block; width: 100%; height: 100%; max-width: none; cursor: grab; outline: 0; touch-action: none; }
    .graph-canvas:active { cursor: grabbing; }
    .graph-canvas:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: -3px; }
    .graph-status { position: absolute; top: 14px; left: 14px; z-index: 2; max-width: calc(100% - 112px); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(8px); pointer-events: none; }
    .graph-status.error { color: var(--danger); }
    .graph-help { position: absolute; right: 14px; bottom: 12px; left: 14px; z-index: 2; text-align: center; font-size: 12px; pointer-events: none; }
    .zoom-controls { position: absolute; top: 14px; right: 14px; z-index: 3; display: grid; gap: 6px; }
    .zoom-controls button { width: 40px; min-height: 40px; padding: 0; background: color-mix(in srgb, var(--card) 92%, transparent); color: var(--text); border: 1px solid var(--line); backdrop-filter: blur(8px); font-size: 18px; }
    .graph-details { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
    .graph-details[hidden] { display: none; }
    .graph-details-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .graph-legend { display: flex; gap: 14px; flex-wrap: wrap; }
    .legend-dot { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; }
    .scope-badge { display: inline-flex; align-items: center; width: fit-content; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    @media (max-width: 760px) {
        .graph-toolbar { grid-template-columns: minmax(0, 1fr); align-items: stretch; }
        .graph-actions > * { flex: 1 1 auto; }
        .graph-actions button { width: auto; }
        .graph-card { height: max(440px, 68dvh); }
        .graph-details { grid-template-columns: minmax(0, 1fr); }
        .graph-details-actions { justify-content: stretch; }
        .graph-details-actions > * { flex: 1 1 100%; width: 100%; }
        .graph-help { text-align: left; padding-right: 46px; }
    }
</style>
{% endblock %}
{% block content %}
<section class="stack">
    <div class="graph-heading">
        <div class="stack" style="gap:5px">
            <h1>文章关系图谱</h1>
            <div class="muted">像 Obsidian 一样探索文章内链、反向链接、分类与标签。</div>
            <span id="scope-badge" class="scope-badge muted">全局图谱</span>
        </div>
        <div class="graph-heading-actions">
            <button id="global-graph" class="secondary" type="button" hidden>返回全局图谱</button>
            <a class="button secondary" href="{% url 'home' %}">返回文章</a>
        </div>
    </div>

    <div class="card graph-toolbar">
        <label class="graph-search">搜索节点
            <input id="graph-filter" maxlength="100" placeholder="文章、分类或标签" autocomplete="off">
        </label>
        <div class="graph-filters" aria-label="节点类型筛选">
            <label><input type="checkbox" value="article" checked>文章</label>
            <label><input type="checkbox" value="category" checked>分类</label>
            <label><input type="checkbox" value="tag" checked>标签</label>
        </div>
        <div class="graph-actions">
            <label>局部深度
                <select id="graph-depth" aria-label="局部图谱深度">
                    <option value="1">1 层</option>
                    <option value="2">2 层</option>
                    <option value="3">3 层</option>
                </select>
            </label>
            <button id="graph-refresh" class="secondary" type="button">刷新</button>
            <button id="graph-reset" class="secondary" type="button">重置布局</button>
        </div>
    </div>

    <div class="card graph-card">
        <canvas id="graph" class="graph-canvas" tabindex="0" role="application" aria-label="文章、分类、标签与文章内链的交互式关系图谱"></canvas>
        <div id="graph-status" class="graph-status muted" role="status">正在构建图谱…</div>
        <div class="zoom-controls" aria-label="图谱缩放控制">
            <button id="zoom-in" type="button" aria-label="放大">＋</button>
            <button id="zoom-out" type="button" aria-label="缩小">−</button>
            <button id="zoom-fit" type="button" aria-label="适应画布">⌂</button>
        </div>
        <div class="graph-help muted">拖动画布 · 拖拽节点 · 滚轮或双指缩放 · 双击文章编辑</div>
    </div>

    <aside id="graph-details" class="card graph-details" hidden aria-live="polite">
        <div>
            <strong id="detail-title"></strong>
            <div id="detail-meta" class="muted"></div>
        </div>
        <div class="graph-details-actions">
            <a id="edit-node" class="button" href="#" hidden>编辑文章</a>
            <button id="local-graph" class="secondary" type="button" hidden>查看局部图谱</button>
            <button id="release-node" class="secondary" type="button">取消固定</button>
        </div>
    </aside>

    <div class="graph-legend muted" aria-label="图例">
        <span><i class="legend-dot" style="background:var(--primary)"></i>文章</span>
        <span><i class="legend-dot" style="background:#d97706"></i>分类</span>
        <span><i class="legend-dot" style="background:#059669"></i>标签</span>
        <span>亮色连线：文章内链</span>
    </div>
</section>
<script>
(() => {
    const canvas = document.getElementById('graph');
    const context = canvas.getContext('2d');
    const status = document.getElementById('graph-status');
    const filter = document.getElementById('graph-filter');
    const refresh = document.getElementById('graph-refresh');
    const reset = document.getElementById('graph-reset');
    const depth = document.getElementById('graph-depth');
    const globalButton = document.getElementById('global-graph');
    const scopeBadge = document.getElementById('scope-badge');
    const details = document.getElementById('graph-details');
    const detailTitle = document.getElementById('detail-title');
    const detailMeta = document.getElementById('detail-meta');
    const editNode = document.getElementById('edit-node');
    const localButton = document.getElementById('local-graph');
    const releaseButton = document.getElementById('release-node');
    const apiUrl = '{% url 'graph_api' %}';
    const editUrl = '{% url 'edit_article' %}';
    const typeLabels = { article: '文章', category: '分类', tag: '标签' };
    const typeColors = { article: '#5478ff', category: '#d97706', tag: '#059669' };
    const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const pointers = new Map();
    const camera = { x: 0, y: 0, scale: 1 };
    let graph = { nodes: [], edges: [], scope: 'global', focus: '' };
    let nodesById = new Map();
    let selected = null;
    let hovered = null;
    let interaction = null;
    let pinch = null;
    let animationFrame = 0;
    let alpha = 0;
    let scopeFocus = new URLSearchParams(window.location.search).get('focus') || '';
    let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    let activeTypes = new Set(['article', 'category', 'tag']);

    function themeColors() {
        const styles = getComputedStyle(document.documentElement);
        return {
            card: styles.getPropertyValue('--card').trim() || '#fff',
            text: styles.getPropertyValue('--text').trim() || '#172033',
            muted: styles.getPropertyValue('--muted').trim() || '#697386',
            line: styles.getPropertyValue('--line').trim() || '#d9dfeb',
            primary: styles.getPropertyValue('--primary').trim() || '#315efb'
        };
    }

    function hash(value) {
        let result = 2166136261;
        for (let index = 0; index < value.length; index += 1) {
            result ^= value.charCodeAt(index);
            result = Math.imul(result, 16777619);
        }
        return result >>> 0;
    }

    function nodeRadius(node) {
        return 5 + Math.min(8, Math.sqrt(Math.max(node.degree || 1, 1)) * 1.8);
    }

    function initializeGraph(data) {
        const previous = new Map(graph.nodes.map(node => [node.id, node]));
        graph = {
            nodes: data.nodes.map((node, index) => {
                const old = previous.get(node.id);
                const angle = (hash(node.id) % 360) * Math.PI / 180;
                const radius = 50 + (hash(node.id + ':radius') % 220);
                return {
                    ...node,
                    x: old ? old.x : Math.cos(angle) * radius,
                    y: old ? old.y : Math.sin(angle) * radius,
                    vx: 0,
                    vy: 0,
                    fx: old ? old.fx : null,
                    fy: old ? old.fy : null,
                    index
                };
            }),
            edges: data.edges,
            scope: data.scope || 'global',
            focus: data.focus || ''
        };
        nodesById = new Map(graph.nodes.map(node => [node.id, node]));
        graph.edges = graph.edges.flatMap(edge => {
            const source = nodesById.get(edge.source);
            const target = nodesById.get(edge.target);
            return source && target ? [{ ...edge, source, target }] : [];
        });
        selected = graph.focus ? nodesById.get(graph.focus) || null : null;
        hovered = null;
        updateScope();
        updateDetails();
        restartSimulation(1);
        requestAnimationFrame(() => fitGraph(false));
    }

    function isVisible(node) {
        return activeTypes.has(node.type);
    }

    function visibleNodes() {
        return graph.nodes.filter(isVisible);
    }

    function visibleEdges() {
        return graph.edges.filter(edge => isVisible(edge.source) && isVisible(edge.target));
    }

    function resizeCanvas() {
        const rectangle = canvas.getBoundingClientRect();
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(rectangle.width * pixelRatio));
        const height = Math.max(1, Math.round(rectangle.height * pixelRatio));
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }
        draw();
    }

    function screenPoint(event) {
        const rectangle = canvas.getBoundingClientRect();
        return { x: event.clientX - rectangle.left, y: event.clientY - rectangle.top };
    }

    function worldPoint(point) {
        return { x: (point.x - camera.x) / camera.scale, y: (point.y - camera.y) / camera.scale };
    }

    function screenPosition(node) {
        return { x: node.x * camera.scale + camera.x, y: node.y * camera.scale + camera.y };
    }

    function nodeAt(point) {
        const nodes = visibleNodes();
        for (let index = nodes.length - 1; index >= 0; index -= 1) {
            const node = nodes[index];
            const position = screenPosition(node);
            const radius = Math.max(11, nodeRadius(node) * camera.scale + 5);
            if (Math.hypot(point.x - position.x, point.y - position.y) <= radius) return node;
        }
        return null;
    }

    function connectedIds(node) {
        const result = new Set(node ? [node.id] : []);
        if (!node) return result;
        visibleEdges().forEach(edge => {
            if (edge.source.id === node.id) result.add(edge.target.id);
            if (edge.target.id === node.id) result.add(edge.source.id);
        });
        return result;
    }

    function searchMatches() {
        const query = filter.value.trim().toLocaleLowerCase();
        if (!query) return new Set();
        return new Set(graph.nodes.filter(node => node.label.toLocaleLowerCase().includes(query)).map(node => node.id));
    }

    function drawArrow(source, target, color, opacity) {
        const angle = Math.atan2(target.y - source.y, target.x - source.x);
        const targetRadius = nodeRadius(target) + 3;
        const x = target.x - Math.cos(angle) * targetRadius;
        const y = target.y - Math.sin(angle) * targetRadius;
        context.save();
        context.globalAlpha = opacity;
        context.fillStyle = color;
        context.beginPath();
        context.moveTo(x, y);
        context.lineTo(x - Math.cos(angle - Math.PI / 6) * 7, y - Math.sin(angle - Math.PI / 6) * 7);
        context.lineTo(x - Math.cos(angle + Math.PI / 6) * 7, y - Math.sin(angle + Math.PI / 6) * 7);
        context.closePath();
        context.fill();
        context.restore();
    }

    function draw() {
        const width = canvas.width / pixelRatio;
        const height = canvas.height / pixelRatio;
        const colors = themeColors();
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.clearRect(0, 0, width, height);
        context.save();
        context.translate(camera.x, camera.y);
        context.scale(camera.scale, camera.scale);
        const focusNode = hovered || selected;
        const neighbors = connectedIds(focusNode);
        const matches = searchMatches();
        const hasSearch = matches.size > 0 || filter.value.trim();

        visibleEdges().forEach(edge => {
            const highlighted = !focusNode || (neighbors.has(edge.source.id) && neighbors.has(edge.target.id));
            const searchHighlight = !hasSearch || matches.has(edge.source.id) || matches.has(edge.target.id);
            const opacity = highlighted && searchHighlight ? (edge.type === 'link' ? 0.82 : 0.42) : 0.08;
            context.beginPath();
            context.moveTo(edge.source.x, edge.source.y);
            context.lineTo(edge.target.x, edge.target.y);
            context.lineWidth = (edge.type === 'link' ? 1.7 : 1.05) / camera.scale;
            context.strokeStyle = edge.type === 'link' ? colors.primary : colors.line;
            context.globalAlpha = opacity;
            context.stroke();
            context.globalAlpha = 1;
            if (edge.directed && camera.scale > 0.55) drawArrow(edge.source, edge.target, colors.primary, opacity);
        });

        visibleNodes().forEach(node => {
            const highlighted = !focusNode || neighbors.has(node.id);
            const searchHighlight = !hasSearch || matches.has(node.id);
            const radius = nodeRadius(node);
            context.globalAlpha = highlighted && searchHighlight ? 1 : 0.16;
            context.beginPath();
            context.arc(node.x, node.y, radius, 0, Math.PI * 2);
            context.fillStyle = typeColors[node.type] || colors.primary;
            context.fill();
            if (node === selected || node === hovered || matches.has(node.id)) {
                context.lineWidth = 2.5 / camera.scale;
                context.strokeStyle = colors.text;
                context.stroke();
            }
            const shouldLabel = camera.scale > 0.58 && (node.type === 'article' || node === selected || node === hovered || matches.has(node.id));
            if (shouldLabel) {
                const label = node.label.length > 32 ? node.label.slice(0, 31) + '…' : node.label;
                const fontSize = Math.max(10, Math.min(13, 12 / Math.sqrt(camera.scale)));
                context.font = `600 ${fontSize}px system-ui, sans-serif`;
                context.textBaseline = 'middle';
                context.lineWidth = 4 / camera.scale;
                context.strokeStyle = colors.card;
                context.strokeText(label, node.x + radius + 5, node.y);
                context.fillStyle = colors.text;
                context.fillText(label, node.x + radius + 5, node.y);
            }
            context.globalAlpha = 1;
        });
        context.restore();
    }

    function simulationStep() {
        const nodes = visibleNodes();
        const edges = visibleEdges();
        if (!nodes.length) {
            draw();
            animationFrame = 0;
            return;
        }
        const interactionAlpha = reducedMotion ? 0 : alpha;
        if (interactionAlpha > 0.004) {
            const comparisonLimit = nodes.length > 260 ? 80 : nodes.length;
            for (let left = 0; left < nodes.length; left += 1) {
                const a = nodes[left];
                for (let offset = 1; offset < comparisonLimit; offset += 1) {
                    const right = (left + offset) % nodes.length;
                    if (right <= left && nodes.length <= 260) continue;
                    const b = nodes[right];
                    let dx = a.x - b.x;
                    let dy = a.y - b.y;
                    let distanceSquared = dx * dx + dy * dy;
                    if (distanceSquared < 1) {
                        dx = ((hash(a.id + b.id) % 20) - 10) / 10;
                        dy = 1;
                        distanceSquared = dx * dx + dy * dy;
                    }
                    const distance = Math.sqrt(distanceSquared);
                    const force = Math.min(2.8, 1050 / distanceSquared) * interactionAlpha;
                    const fx = dx / distance * force;
                    const fy = dy / distance * force;
                    a.vx += fx;
                    a.vy += fy;
                    b.vx -= fx;
                    b.vy -= fy;
                }
            }
            edges.forEach(edge => {
                const dx = edge.target.x - edge.source.x;
                const dy = edge.target.y - edge.source.y;
                const distance = Math.max(Math.hypot(dx, dy), 1);
                const desired = edge.type === 'link' ? 105 : 82;
                const strength = (distance - desired) * (edge.type === 'link' ? 0.008 : 0.012) * interactionAlpha;
                const fx = dx / distance * strength;
                const fy = dy / distance * strength;
                edge.source.vx += fx;
                edge.source.vy += fy;
                edge.target.vx -= fx;
                edge.target.vy -= fy;
            });
            nodes.forEach(node => {
                node.vx += -node.x * 0.0018 * interactionAlpha;
                node.vy += -node.y * 0.0018 * interactionAlpha;
                if (node.fx !== null && node.fy !== null) {
                    node.x = node.fx;
                    node.y = node.fy;
                    node.vx = 0;
                    node.vy = 0;
                } else {
                    node.vx *= 0.84;
                    node.vy *= 0.84;
                    node.x += node.vx;
                    node.y += node.vy;
                }
            });
            alpha *= reducedMotion ? 0 : 0.965;
        }
        draw();
        if (alpha > 0.004 || interaction) animationFrame = requestAnimationFrame(simulationStep);
        else animationFrame = 0;
    }

    function restartSimulation(value = 0.65) {
        alpha = Math.max(alpha, reducedMotion ? 0 : value);
        if (!animationFrame) animationFrame = requestAnimationFrame(simulationStep);
    }

    function fitGraph(animate = true) {
        const nodes = visibleNodes();
        if (!nodes.length) return;
        const width = canvas.width / pixelRatio;
        const height = canvas.height / pixelRatio;
        const xs = nodes.map(node => node.x);
        const ys = nodes.map(node => node.y);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);
        const targetScale = Math.max(0.28, Math.min(2.2, Math.min(
            (width - 100) / Math.max(maxX - minX, 120),
            (height - 100) / Math.max(maxY - minY, 120)
        )));
        camera.scale = targetScale;
        camera.x = width / 2 - ((minX + maxX) / 2) * targetScale;
        camera.y = height / 2 - ((minY + maxY) / 2) * targetScale;
        draw();
        if (animate) restartSimulation(0.3);
    }

    function zoomAt(point, factor) {
        const before = worldPoint(point);
        camera.scale = Math.max(0.2, Math.min(4, camera.scale * factor));
        camera.x = point.x - before.x * camera.scale;
        camera.y = point.y - before.y * camera.scale;
        draw();
    }

    function updateDetails() {
        if (!selected) {
            details.hidden = true;
            return;
        }
        details.hidden = false;
        detailTitle.textContent = selected.label;
        detailMeta.textContent = `${typeLabels[selected.type] || selected.type} · ${selected.degree || 0} 条关系${selected.fx !== null ? ' · 已固定' : ''}`;
        const isArticle = selected.type === 'article';
        editNode.hidden = !isArticle;
        localButton.hidden = !isArticle || graph.focus === selected.id;
        if (isArticle) editNode.href = editUrl + '?' + new URLSearchParams({ path: selected.path }).toString();
    }

    function selectNode(node) {
        selected = node;
        updateDetails();
        draw();
    }

    function updateScope() {
        const local = graph.scope === 'local' && graph.focus;
        scopeBadge.textContent = local ? '局部图谱' : '全局图谱';
        globalButton.hidden = !local;
        depth.disabled = !local;
        const parameters = new URLSearchParams(window.location.search);
        if (local && scopeFocus) parameters.set('focus', scopeFocus);
        else parameters.delete('focus');
        const query = parameters.toString();
        history.replaceState(null, '', window.location.pathname + (query ? '?' + query : ''));
    }

    function resetLayout() {
        graph.nodes.forEach(node => {
            const angle = (hash(node.id) % 360) * Math.PI / 180;
            const radius = 50 + (hash(node.id + ':reset') % 220);
            node.x = Math.cos(angle) * radius;
            node.y = Math.sin(angle) * radius;
            node.vx = 0;
            node.vy = 0;
            node.fx = null;
            node.fy = null;
        });
        updateDetails();
        restartSimulation(1);
        requestAnimationFrame(() => fitGraph(false));
    }

    async function load(force = false) {
        status.hidden = false;
        status.classList.remove('error');
        status.textContent = force ? '正在刷新图谱…' : '正在构建图谱…';
        refresh.disabled = true;
        const parameters = new URLSearchParams();
        if (force) parameters.set('refresh', '1');
        if (scopeFocus) {
            parameters.set('focus', scopeFocus);
            parameters.set('depth', depth.value);
        }
        try {
            const query = parameters.toString();
            const response = await fetch(apiUrl + (query ? '?' + query : ''), { headers: { Accept: 'application/json' } });
            const data = await response.json();
            if (!response.ok || !data.status) throw new Error(data.error || '图谱载入失败');
            initializeGraph(data);
            status.textContent = `${data.nodes.length} 个节点 · ${data.edges.length} 条关系`;
            window.setTimeout(() => { if (!status.classList.contains('error')) status.hidden = true; }, 1800);
        } catch (error) {
            status.hidden = false;
            status.classList.add('error');
            status.textContent = error.message || '图谱载入失败';
        } finally {
            refresh.disabled = false;
        }
    }

    canvas.addEventListener('pointerdown', event => {
        canvas.setPointerCapture(event.pointerId);
        const point = screenPoint(event);
        pointers.set(event.pointerId, point);
        if (pointers.size === 2) {
            const values = Array.from(pointers.values());
            pinch = {
                distance: Math.max(Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y), 1),
                midpoint: { x: (values[0].x + values[1].x) / 2, y: (values[0].y + values[1].y) / 2 }
            };
            interaction = null;
            return;
        }
        const node = nodeAt(point);
        interaction = { mode: node ? 'node' : 'pan', node, start: point, last: point, moved: false };
        if (node) selectNode(node);
        restartSimulation(0.4);
    });

    canvas.addEventListener('pointermove', event => {
        const point = screenPoint(event);
        if (pointers.has(event.pointerId)) pointers.set(event.pointerId, point);
        if (pointers.size === 2 && pinch) {
            const values = Array.from(pointers.values());
            const distance = Math.max(Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y), 1);
            const midpoint = { x: (values[0].x + values[1].x) / 2, y: (values[0].y + values[1].y) / 2 };
            camera.x += midpoint.x - pinch.midpoint.x;
            camera.y += midpoint.y - pinch.midpoint.y;
            zoomAt(midpoint, distance / pinch.distance);
            pinch = { distance, midpoint };
            return;
        }
        if (interaction && pointers.has(event.pointerId)) {
            const distance = Math.hypot(point.x - interaction.start.x, point.y - interaction.start.y);
            interaction.moved ||= distance > 4;
            if (interaction.mode === 'node') {
                const world = worldPoint(point);
                interaction.node.fx = world.x;
                interaction.node.fy = world.y;
            } else {
                camera.x += point.x - interaction.last.x;
                camera.y += point.y - interaction.last.y;
            }
            interaction.last = point;
            restartSimulation(0.28);
            draw();
            return;
        }
        if (event.pointerType === 'mouse') {
            const node = nodeAt(point);
            if (node !== hovered) {
                hovered = node;
                canvas.style.cursor = node ? 'pointer' : 'grab';
                draw();
            }
        }
    });

    function endPointer(event) {
        const finished = interaction;
        pointers.delete(event.pointerId);
        if (pointers.size < 2) pinch = null;
        if (pointers.size === 0) interaction = null;
        if (finished && finished.mode === 'pan' && !finished.moved) selectNode(null);
        updateDetails();
        draw();
    }

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave', () => {
        if (!pointers.size && hovered) {
            hovered = null;
            draw();
        }
    });
    canvas.addEventListener('dblclick', event => {
        const node = nodeAt(screenPoint(event));
        if (node && node.type === 'article') window.location.assign(editUrl + '?' + new URLSearchParams({ path: node.path }).toString());
    });
    canvas.addEventListener('wheel', event => {
        event.preventDefault();
        zoomAt(screenPoint(event), Math.exp(-event.deltaY * 0.0015));
    }, { passive: false });
    canvas.addEventListener('keydown', event => {
        const movement = 36;
        if (event.key === 'ArrowLeft') camera.x += movement;
        else if (event.key === 'ArrowRight') camera.x -= movement;
        else if (event.key === 'ArrowUp') camera.y += movement;
        else if (event.key === 'ArrowDown') camera.y -= movement;
        else if (event.key === '+' || event.key === '=') zoomAt({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }, 1.2);
        else if (event.key === '-') zoomAt({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }, 1 / 1.2);
        else if (event.key === '0') fitGraph();
        else if (event.key === 'Enter' && selected && selected.type === 'article') window.location.assign(editNode.href);
        else return;
        event.preventDefault();
        draw();
    });

    filter.addEventListener('input', draw);
    filter.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        const query = filter.value.trim().toLocaleLowerCase();
        const match = query && graph.nodes.find(node => node.label.toLocaleLowerCase().includes(query));
        if (match) {
            selectNode(match);
            camera.x = canvas.clientWidth / 2 - match.x * camera.scale;
            camera.y = canvas.clientHeight / 2 - match.y * camera.scale;
            draw();
        }
    });
    document.querySelectorAll('.graph-filters input').forEach(input => input.addEventListener('change', () => {
        activeTypes = new Set(Array.from(document.querySelectorAll('.graph-filters input:checked')).map(item => item.value));
        restartSimulation(0.55);
        requestAnimationFrame(() => fitGraph(false));
    }));
    refresh.addEventListener('click', () => load(true));
    reset.addEventListener('click', resetLayout);
    depth.addEventListener('change', () => { if (scopeFocus) load(false); });
    globalButton.addEventListener('click', () => { scopeFocus = ''; load(false); });
    localButton.addEventListener('click', () => {
        if (!selected || selected.type !== 'article') return;
        scopeFocus = selected.path;
        load(false);
    });
    releaseButton.addEventListener('click', () => {
        if (!selected) return;
        selected.fx = null;
        selected.fy = null;
        updateDetails();
        restartSimulation(0.5);
    });
    document.getElementById('zoom-in').addEventListener('click', () => zoomAt({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }, 1.25));
    document.getElementById('zoom-out').addEventListener('click', () => zoomAt({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }, 0.8));
    document.getElementById('zoom-fit').addEventListener('click', () => fitGraph());
    if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(canvas);
    else window.addEventListener('resize', resizeCanvas);
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
    if (colorScheme.addEventListener) colorScheme.addEventListener('change', draw);
    else colorScheme.addListener(draw);
    resizeCanvas();
    load(false);
})();
</script>
{% endblock %}
